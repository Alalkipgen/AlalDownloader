name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for git tag access

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate secrets
        run: |
          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "::error::Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          if [[ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]]; then
            echo "::error::Missing KEYSTORE_PASSWORD secret"
            exit 1
          fi
          if [[ -z "${{ secrets.KEY_ALIAS }}" ]]; then
            echo "::error::Missing KEY_ALIAS secret"
            exit 1
          fi
          if [[ -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "::error::Missing KEY_PASSWORD secret"
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ${{ runner.temp }}/keystore.jks
          ls -lh ${{ runner.temp }}/keystore.jks

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: "true"
          VERSION_TAG: ${{ inputs.version }}
        run: |
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify permanent APK signer
        env:
          EXPECTED_CERT_SHA256: "f2e9c10c6f3bcab6570c01d7f4702a94e5102d17c5349d58959f03b65a45b165"
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk_path" || { echo "::error::Release APK not found at $apk_path"; exit 1; }
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          signature_output="$("$apksigner" verify --print-certs "$apk_path")"
          printf '%s\n' "$signature_output"
          actual_cert_sha256="$(printf '%s\n' "$signature_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Release APK was not signed by the permanent Downloader key"
            exit 1
          fi
          echo "Permanent release signature verified"

      - name: Determine version tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="v0.1.0-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Rename release artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-output
          
          apk_name="Downloader-${VERSION}.apk"
          aab_name="Downloader-${VERSION}.aab"
          
          cp app/build/outputs/apk/release/app-release.apk "release-output/$apk_name"
          cp app/build/outputs/bundle/release/app-release.aab "release-output/$aab_name"
          
          echo "apk=release-output/$apk_name" >> $GITHUB_OUTPUT
          echo "aab=release-output/$aab_name" >> $GITHUB_OUTPUT
          
          ls -lh release-output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ steps.artifacts.outputs.apk }}
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: ${{ steps.artifacts.outputs.aab }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.aab }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
